<script>

 {name:'Tens',unit:'ten',color:'#e0a900'},

 {name:'Thousands',unit:'thousand',color:'#119bd8'},
 {name:'Ten Thousands',unit:'ten-thousand',color:'#1778db'},
 {name:'Hundred Thousands',unit:'hundred-thousand',color:'#e58b19'},

// unmatched final unit in the BOTTOM row, not the top row.
function blockCells(kind,count){
 const stacked=kind==='flat'||kind==='cube'||kind==='single cube';

  col:Math.floor(i/2),
  row:(count%2===1&&i===count-1)?1:i%2

  ?(w-2*margin-(usedColumns-1)*2)/usedColumns

function pointInsidePolygon(x,y,points){
